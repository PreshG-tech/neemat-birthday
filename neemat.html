<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    .top{ background:linear-gradient(to left, purple,rgb(254, 255, 255)) ;
        height: 600px;
        
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }
    .bday{
        font-size:40px;
        font-weight: 500;
        font-family: cursive;   
    
    
    
    }
    .bday h1{
         font-size: 50px; /* a bit bigger */
    background: linear-gradient(to right, #ff6b9d, #c44569, #ff6b9d); /* pink → purple → gold */
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    text-shadow: 0 0 20px rgba(255, 107, 157, 0.3); /* soft glow */

    }
    .new{
       
        width: 900px;
        
        margin: 20px;
        border-radius: 20px;
        box-shadow: 1px 1px 7px black;
        text-align: center;
        
    }
    
    .second{
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        margin: 20px;
        

    }
    .card{
        background-color:white;
        height: 250px;
         width: 250px;
     
        border-color: purple;
        box-shadow:5px 4px 7px;
        border-style: solid;
        border-radius: 30px;
    }
    .card img{ width: 250px;
        height: 250px;
        border-radius: 25px;
    
    
    
    
    
    }
    
    .large{
        height: 600px;
        width:100%;
        position:relative;



    }
    .large img{
        width :100%;
        height:100%;
        object-fit: cover;
        object-position: center;
        border-radius: 10px;


    }


</style>


</head>
<body>
    <section class="top">
        <div style="display: flex; justify-content: center;">
          <div class="bday">
                <h1>
                HAPPY BIRTHDAY NEEMAT!!!!
                </h1>
            </div>  
        </div>
        <div class="new">
            <h2 class="dear">
                Dear Neemat 💖<br>
                On your special day, we just want to say you’re amazing! May your new age be full of laughter, dreams,
                and lots of fun Love you tons!
            </h2>
        </div>
    </section>
    <section class="second">

        
        <div class=" card">
            <img src="/pics.html/fierce cat (1).jpeg">
    

        </div>
        <div class="card">
            <img src="/pics.html/OIP (2).webp">
        </div>
        <div class="card">
            <img src="/pics.html/NET-BG.jpg">

        </div>
        <div class="card">
            <img src="/pics.html/NET-BG.jpg">
        </div>
    </section>
    <section class="large">
        <img src="pics.html/woman.webp" alt="">
    </section>
    
    <section class="greet">
        <div><h1>Greetings</h1></div>
    </section>
    
</body>
</html>
