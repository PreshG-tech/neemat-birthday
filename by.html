<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Neemat</title>
<style>
    body {
        margin: 0;
        font-family: cursive;
        background: white;
    }
    .top{ 
        background: linear-gradient(to left, #8a2be2, rgb(210, 151, 209)) ;
        height: 600px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 30px;
        padding: 20px;
    }
    .bday h1{
        font-size: 50px; 
        margin: 0;
        background: linear-gradient(to right, #ff6b9d, #c44569, #a855f7); /* pink → purple */
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 0 20px rgba(255, 107, 157, 0.3);
        text-align: center;
    }
    .new{
        background: white;
        max-width: 900px;
        padding: 20px;
        border-radius: 20px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        text-align: center;
    }
    .dear{
        font-size: 24px;
        font-weight: 500;
        background: linear-gradient(to right, #22c55e, #8a2be2); /* green → purple */
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
    }
    .second{
        display: flex;
        flex-direction: row;
        justify-content: center;
        gap: 40px;
        padding: 40px;
        flex-wrap: wrap;
    }
    .card{
        background-color: white;
        width: 250px;
        height: 250px;
        border-radius: 15px;
        border: 2px solid #8a2be2;
        box-shadow: 0 4px 12px rgba(138, 43, 226, 0.3);
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

</style>
</head>
<body>
    <section class="top">
        <div class="bday">
            <h1>
                HAPPY BIRTHDAY NEEMAT!!!!
            </h1>
        </div>  
        <div class="new">
            <h2 class="dear">
                Dear Neemat <span>💖</span> <br>
                On your special day, I just want to say you’re amazing! May your new age be full of laughter, dreams,
                and lots of fun. Love you tons!
            </h2>
        </div>
    </section>

    <section class="second">
        <div class="card">
            <img src="pics.html/fierce cat (1).jpeg" alt="fierce cat">
        </div>
        <div class="card">
            <img src="pics.html/fierce cat (1).jpeg" alt="fierce cat">
        </div>
        <div class="card">
            <img src="pics.html/fierce cat (1).jpeg" alt="fierce cat">
        </div>
    </section>
</body>
</html>
